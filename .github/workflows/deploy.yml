name: Full Stack CI/CD - Test Branch

on:
  push:
    branches:
      - test


jobs:

# =========================
# 1. BUILD BACKEND
# =========================
  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend
        run: |
          cd "02-backend/spring-boot rest api"
          mvn clean package -DskipTests

      - name: Verify JAR
        run: |
          ls -lah "02-backend/spring-boot rest api/target"

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 02-backend/spring-boot rest api/target/*.jar


# =========================
# 2. DEPLOY BACKEND
# =========================
  deploy-backend:
    name: Deploy Backend to VM
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: List files (debug)
        run: ls -lah

      # FIXED SCP (IMPORTANT)
      - name: Copy JAR to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          source: "*.jar"
          target: "/tmp/app.jar"
          debug: true

      - name: Deploy Backend on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            echo "Deploying backend..."

            mkdir -p /home/azureuser/app/backend

            mv /tmp/app.jar /home/azureuser/app/backend/app.jar

            sudo systemctl daemon-reload
            sudo systemctl restart springboot-app
            sleep 10

            curl -f http://localhost:8080/api/products || exit 1

            echo "Backend deployed successfully"


# =========================
# 3. BUILD FRONTEND
# =========================
  build-frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Angular App
        run: |
          cd frontend
          npm run build --prod

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/


# =========================
# 4. DEPLOY FRONTEND (NGINX)
# =========================
  deploy-frontend:
    name: Deploy Frontend to Nginx
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Copy Frontend to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          port: 22
          source: "dist/*"
          target: "/tmp/frontend"

      - name: Deploy Frontend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            echo "Deploying frontend..."

            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/frontend/* /var/www/html/
            sudo systemctl restart nginx

            echo "Frontend deployed successfully"
