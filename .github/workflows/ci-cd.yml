name: Ecommerce AKS CI-CD Pipeline

on:
  push:
    branches:
      - prod

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_NAME: ${{ secrets.AKS_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

# -------------------------
# BUILD & PUSH BACKEND
# -------------------------
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend (Maven)
        run: |
          cd "02-backend/spring-boot rest api"
          mvn clean package -DskipTests

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ecommerceacrprod

      - name: Build Backend Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/ecommerce-backend:$IMAGE_TAG \
            02-backend/spring-boot\ rest\ api

      - name: Push Backend Image
        run: |
          docker push $ACR_LOGIN_SERVER/ecommerce-backend:$IMAGE_TAG


# -------------------------
# BUILD & PUSH FRONTEND
# -------------------------
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ecommerceacrprod

      - name: Build Frontend Image
        run: |
          docker build -t $ACR_LOGIN_SERVER/ecommerce-frontend:$IMAGE_TAG \
            03-frontend/angular-ecommerce

      - name: Push Frontend Image
        run: |
          docker push $ACR_LOGIN_SERVER/ecommerce-frontend:$IMAGE_TAG


# -------------------------
# DEPLOY TO AKS
# -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_NAME }}

      - name: Update Image Tags in Kubernetes YAML
        run: |
          sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/*.yaml

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/

          kubectl rollout status deployment/ecommerce-backend -n ecommerce
          kubectl rollout status deployment/ecommerce-frontend -n ecommerce
