name: Frontend CI/CD to AKS

on:
  workflow_dispatch:
    push:
      branches:
        - 
      paths:
        - '03-frontend/**'
        - '.github/workflows/frontend.yml'

permissions:
  contents: read

env:
  ACR_NAME: ecommerceacrprod
  IMAGE_NAME: ecommerce-frontend
  RESOURCE_GROUP: ecommerce-rg
  AKS_CLUSTER_NAME: ecommerce-aks
  NAMESPACE: ecommerce

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Azure Login (using AZURE_CREDENTIALS secret)
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 3. Login to ACR
    - name: Login to ACR
      run: |
        az acr login --name $ACR_NAME

    # 4. Build Docker Image
    - name: Build Docker Image
      run: |
        docker build \
          -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
          ./03-frontend/angular-ecommerce

    # 5. Push Docker Image
    - name: Push Docker Image
      run: |
        docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

    # 6. Set AKS context
    - name: Set AKS context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ env.RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER_NAME }}

    # 7. Deploy to AKS
    - name: Deploy to AKS
      run: |
        kubectl set image deployment/ecommerce-frontend \
          frontend=$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
          -n $NAMESPACE

        kubectl rollout status deployment/ecommerce-frontend -n $NAMESPACE
