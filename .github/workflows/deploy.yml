name: CI/CD Deployment - Test Branch

on:
  push:
    branches:
      - test

jobs:

  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend with Maven
        run: |
          cd "02-backend/spring-boot rest api"
          mvn clean package -DskipTests

      - name: Verify JAR Exists
        run: |
          ls -lah "02-backend/spring-boot rest api/target/"

      - name: Upload JAR Artifact (for next job)
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 02-backend/spring-boot rest api/target/*.jar


  deploy-backend:
    name: Deploy Backend to VM
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      - name: Show downloaded files
        run: ls -lah

      - name: Copy JAR to VM (/tmp)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          source: "*.jar"
          target: "/tmp/app.jar"

      - name: Deploy and Restart Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_KEY }}
          script: |
            echo "Deploying backend..."

            mkdir -p /home/azureuser/app/backend

            mv /tmp/app.jar /home/azureuser/app/backend/app.jar

            sudo systemctl daemon-reload
            sudo systemctl restart springboot-app
            sleep 10

            echo "Checking API..."
            curl -f http://localhost:8080/api/products || exit 1

            echo "Backend deployment SUCCESS 🎉"
