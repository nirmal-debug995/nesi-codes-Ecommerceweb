apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: ecommerce-frontend
        image: ecommerceacrprod.azurecr.io/ecommerce-frontend:IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 80
