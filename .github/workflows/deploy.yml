name: Test Branch CI/CD Deployment

on:
  push:
    branches:
      - test

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Backend (Spring Boot)
        run: |
          cd 02-backend/spring-boot\ rest\ api
          mvn clean package -DskipTests

      - name: Copy JAR to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "02-backend/spring-boot rest api/target/app.jar"
          target: "/tmp/"

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Deploying backend..."
            mv /tmp/app.jar /home/azureuser/app/backend/app.jar
            sudo systemctl daemon-reload
            sudo systemctl restart springboot-app
            sleep 10
            curl -f http://localhost:8080/api/products || exit 1
            echo "Backend deployment success"

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install & Build Frontend
        run: |
          cd 01-frontend
          npm install
          npm run build

      - name: Deploy Frontend to Nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "01-frontend/dist/"
          target: "/tmp/frontend"

      - name: Activate Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/frontend/* /var/www/html/
            sudo systemctl restart nginx
            echo "Frontend deployed"
