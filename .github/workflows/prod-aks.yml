name: AKS Deployment Pipeline

on:
  push:
    branches:
      - prod

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_NAME: ${{ secrets.AKS_NAME }}

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: az acr login --name ecommerceacrprod

    - name: Build Backend Image
      run: |
        docker build \
        -t $ACR_LOGIN_SERVER/ecommerce-backend:${{ github.sha }} \
        02-backend/spring-boot\ rest\ api

    - name: Build Frontend Image
      run: |
        docker build \
        -t $ACR_LOGIN_SERVER/ecommerce-frontend:${{ github.sha }} \
        03-frontend/angular-ecommerce

    - name: Push Backend Image
      run: |
        docker push $ACR_LOGIN_SERVER/ecommerce-backend:${{ github.sha }}

    - name: Push Frontend Image
      run: |
        docker push $ACR_LOGIN_SERVER/ecommerce-frontend:${{ github.sha }}

    - name: Set AKS Context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ secrets.RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_NAME }}

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/

        kubectl set image deployment/ecommerce-backend \
        ecommerce-backend=$ACR_LOGIN_SERVER/ecommerce-backend:${{ github.sha }} -n ecommerce

        kubectl set image deployment/ecommerce-frontend \
        ecommerce-frontend=$ACR_LOGIN_SERVER/ecommerce-frontend:${{ github.sha }} -n ecommerce
