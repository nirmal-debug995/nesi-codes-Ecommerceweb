name: AKS Production Deployment Pipeline

on:
  push:
    branches:
      - prod

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  AKS_NAME: ${{ secrets.AKS_NAME }}

jobs:

  build-push-deploy:
    runs-on: ubuntu-latest

    steps:

    # -------------------------
    # STEP 1: Checkout Code
    # -------------------------
    - name: Checkout Code
      uses: actions/checkout@v4

    # -------------------------
    # STEP 2: Setup Java
    # -------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # -------------------------
    # STEP 3: Build Backend (Maven FIRST)
    # -------------------------
    - name: Build Backend with Maven
      run: |
        cd "02-backend/spring-boot rest api"
        mvn clean package -DskipTests

    # -------------------------
    # STEP 4: Verify JAR exists (DEBUG SAFE STEP)
    # -------------------------
    - name: Verify Backend Build Output
      run: |
        ls "02-backend/spring-boot rest api/target"

    # -------------------------
    # STEP 5: Login to Azure
    # -------------------------
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # -------------------------
    # STEP 6: Login to ACR
    # -------------------------
    - name: Login to ACR
      run: az acr login --name ecommerceacrprod

    # -------------------------
    # STEP 7: Build Backend Docker Image
    # -------------------------
    - name: Build Backend Docker Image
      run: |
        docker build \
          -t $ACR_LOGIN_SERVER/ecommerce-backend:${{ github.sha }} \
          02-backend/spring-boot\ rest\ api

    # -------------------------
    # STEP 8: Build Frontend Docker Image
    # -------------------------
    - name: Build Frontend Docker Image
      run: |
        docker build \
          -t $ACR_LOGIN_SERVER/ecommerce-frontend:${{ github.sha }} \
          03-frontend/angular-ecommerce

    # -------------------------
    # STEP 9: Push Backend Image
    # -------------------------
    - name: Push Backend Image
      run: |
        docker push $ACR_LOGIN_SERVER/ecommerce-backend:${{ github.sha }}

    # -------------------------
    # STEP 10: Push Frontend Image
    # -------------------------
    - name: Push Frontend Image
      run: |
        docker push $ACR_LOGIN_SERVER/ecommerce-frontend:${{ github.sha }}

    # -------------------------
    # STEP 11: Set AKS Context
    # -------------------------
    - name: Set AKS Context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ secrets.RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_NAME }}

    - name: Ensure Namespace Exists
      run: |
        kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -

    # -------------------------
    # STEP 12: Deploy to AKS
    # -------------------------
    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/

        kubectl rollout status deployment/ecommerce-backend -n ecommerce
        kubectl rollout status deployment/ecommerce-frontend -n ecommerce

    # -------------------------
    # SUCCESS MESSAGE
    # -------------------------
    - name: Success Message
      run: echo "AKS Deployment Completed Successfully 🚀"
