name: Build and Deploy to AKS

on:
  push:
    branches:
      - aksdeploy

env:
  ACR_NAME: ecommerceacrprod
  RESOURCE_GROUP: ecommerce-aks-rg
  AKS_CLUSTER: ecommerce-aks

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to ACR
      run: |
        az acr login --name $ACR_NAME

    - name: Build Backend Image
      run: |
        docker build \
        -t $ACR_NAME.azurecr.io/ecommerce-backend:${{ github.sha }} \
        ./02-backend

    - name: Push Backend Image
      run: |
        docker push \
        $ACR_NAME.azurecr.io/ecommerce-backend:${{ github.sha }}

    - name: Build Frontend Image
      run: |
        docker build \
        -t $ACR_NAME.azurecr.io/ecommerce-frontend:${{ github.sha }} \
        ./03-frontend

    - name: Push Frontend Image
      run: |
        docker push \
        $ACR_NAME.azurecr.io/ecommerce-frontend:${{ github.sha }}

    - name: Get AKS Credentials
      run: |
        az aks get-credentials \
          --resource-group $RESOURCE_GROUP \
          --name $AKS_CLUSTER \
          --overwrite-existing

    - name: Update Backend Image
      run: |
        kubectl set image deployment/ecommerce-backend \
        backend=$ACR_NAME.azurecr.io/ecommerce-backend:${{ github.sha }} \
        -n ecommerce

    - name: Update Frontend Image
      run: |
        kubectl set image deployment/ecommerce-frontend \
        frontend=$ACR_NAME.azurecr.io/ecommerce-frontend:${{ github.sha }} \
        -n ecommerce

    - name: Verify Rollout
      run: |
        kubectl rollout status deployment/ecommerce-backend -n ecommerce
        kubectl rollout status deployment/ecommerce-frontend -n ecommerce
