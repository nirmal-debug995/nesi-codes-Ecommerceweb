name: CI-CD Pipeline

on:
  push:
    branches:
      - test   # change to main later for prod

jobs:

# =========================
# 🔧 BUILD BACKEND
# =========================
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        run: |
          cd "02-backend/spring-boot rest api"
          mvn clean package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: 02-backend/spring-boot rest api/target/*.jar


# =========================
# 🎨 BUILD FRONTEND (FIXED)
# =========================
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd 03-frontend/angular-ecommerce
          npm install

      - name: Build Angular frontend
        run: |
          cd 03-frontend/angular-ecommerce
          npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: 03-frontend/angular-ecommerce/dist


# =========================
# 🚀 DEPLOY BACKEND (FIXED SCP)
# =========================
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar

      # STEP 1 — COPY TO FOLDER ONLY (FIXED)
      - name: Copy JAR to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "*.jar"
          target: "/home/azureuser/app/backend/"
          overwrite: true

      # STEP 2 — RENAME + RESTART
      - name: Deploy backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Deploying backend..."
            mv /home/azureuser/app/backend/*.jar /home/azureuser/app/backend/app.jar
            sudo systemctl restart springboot-app
            sudo systemctl status springboot-app --no-pager


# =========================
# 🌐 DEPLOY FRONTEND (NGINX FIXED)
# =========================
  deploy-frontend:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build

      - name: Copy frontend to VM (Nginx)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/html"
          overwrite: true

      - name: Restart Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart nginx
