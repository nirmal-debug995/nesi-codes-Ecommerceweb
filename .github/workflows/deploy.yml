name: Deploy to VM (Test Branch)

on:
  push:
    branches:
      - test

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (Backend)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Build Spring Boot backend
      - name: Build Backend (Maven)
        run: |
          cd 02-backend/spring-boot\ rest\ api
          mvn clean package -DskipTests

      # 4️⃣ Setup Node (Frontend)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 5️⃣ Build Angular frontend
      - name: Build Frontend
        run: |
          cd 03-frontend/angular-ecommerce
          npm install
          npm run build --configuration production

      # 6️⃣ Copy files to VM via SSH
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Stopping backend service..."
            sudo systemctl stop springboot-app || true

            echo "Cleaning old deployment..."
            rm -rf /home/azureuser/app/backend/*
            rm -rf /var/www/html/products/*

            mkdir -p /home/azureuser/app/backend
            mkdir -p /var/www/html/products

      # 7️⃣ Copy backend JAR
      - name: Copy Backend JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "02-backend/spring-boot rest api/target/*.jar"
          target: "/home/azureuser/app/backend/"

      # 8️⃣ Copy frontend build
      - name: Copy Frontend Build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "03-frontend/angular-ecommerce/dist/angular-ecommerce/*"
          target: "/var/www/html/products/"

      # 9️⃣ Restart backend on VM
      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            echo "Starting backend..."
            sudo systemctl daemon-reload
            sudo systemctl restart springboot-app
            sudo systemctl status springboot-app --no-pager

            echo "Checking API..."
            curl -f http://localhost:8080/api/products || exit 1

            echo "Deployment successful 🎉"
