name: Full Stack CI/CD

on:
  push:
    branches:
      - test

jobs:

# =========================
# 🟢 BACKEND BUILD + DEPLOY
# =========================
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build Backend (Maven)
      run: |
        cd "02-backend/spring-boot rest api"
        mvn clean package -DskipTests

    - name: List JAR (DEBUG)
      run: |
        ls -lah "02-backend/spring-boot rest api/target"

    # 🔥 FIXED SCP (NO GLOB, EXACT FILE)
    - name: Copy JAR to VM
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "02-backend/spring-boot rest api/target/spring-boot-ecommerce-0.0.1-SNAPSHOT.jar"
        target: "/tmp/app.jar"
        strip_components: 0

    - name: Deploy Backend (restart service)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          sudo systemctl stop springboot-app || true
          sudo mv /tmp/app.jar /home/azureuser/app/backend/app.jar
          sudo systemctl start springboot-app
          sudo systemctl status springboot-app --no-pager


# =========================
# 🟢 FRONTEND BUILD + DEPLOY
# =========================
  frontend:
    runs-on: ubuntu-latest
    needs: backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        cd 03-frontend/angular-ecommerce
        npm install

    - name: Build Angular
      run: |
        cd 03-frontend/angular-ecommerce
        npm run build -- --configuration production

    - name: List dist folder (DEBUG)
      run: |
        ls -lah 03-frontend/angular-ecommerce/dist

    # 🔥 FIXED FRONTEND SCP
    - name: Copy frontend to VM (Nginx)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        source: "03-frontend/angular-ecommerce/dist/angular-ecommerce/*"
        target: "/tmp/frontend"
        strip_components: 4

    - name: Deploy frontend to Nginx
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          sudo rm -rf /var/www/html/*
          sudo cp -r /tmp/frontend/* /var/www/html/
          sudo systemctl restart nginx
